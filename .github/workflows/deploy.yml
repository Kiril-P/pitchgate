name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/kiril-p

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: push image (${{ matrix.service }})
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ideas, review]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/pitchgate-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
      SQL_HOST: ${{ vars.PREFIX }}-sql.database.windows.net
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure as the pipeline's managed identity (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply infra/main.bicep with the new images (infrastructure and release in one deployment)
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          IDEAS_DB_PASSWORD: ${{ secrets.IDEAS_DB_PASSWORD }}
          REVIEW_DB_PASSWORD: ${{ secrets.REVIEW_DB_PASSWORD }}
          ORGANIZER_KEY: ${{ secrets.ORGANIZER_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          COACH_API_KEY: ${{ secrets.COACH_API_KEY }}
        run: |
          outputs=$(az deployment group create -g "$RG" -n "release-${GITHUB_SHA::12}" -f infra/main.bicep \
            --query properties.outputs -o json -p \
            prefix="$PREFIX" uiStorageName="$UI_STORAGE" imageTag="$GITHUB_SHA" \
            sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
            ideasDatabaseUrl="mssql://ideas_app:${IDEAS_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-ideas-db?encrypt=require" \
            reviewDatabaseUrl="mssql://review_app:${REVIEW_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-review-db?encrypt=require" \
            organizerKey="$ORGANIZER_KEY" typesafeApiKey="$TYPESAFE_API_KEY" coachApiKey="$COACH_API_KEY")
          echo "IDEAS_URL=$(jq -r .ideasUrl.value <<<"$outputs")" >> "$GITHUB_ENV"
          echo "REVIEW_URL=$(jq -r .reviewUrl.value <<<"$outputs")" >> "$GITHUB_ENV"
          echo "UI_ORIGIN=$(jq -r .uiOrigin.value <<<"$outputs")" >> "$GITHUB_ENV"

      - name: Serve the UI as a static website (a data-plane setting Bicep cannot hold; idempotent)
        run: |
          az storage blob service-properties update --account-name "$UI_STORAGE" --static-website \
            --index-document index.html --auth-mode key --output none

      - name: Wait until both services report this commit on /health
        run: |
          # A cold start plus a paused database resuming can take over a minute, so allow five.
          for url in "$REVIEW_URL" "$IDEAS_URL"; do
            for attempt in $(seq 1 30); do
              body=$(curl -s --max-time 40 "$url/health" || true)
              echo "$url/health (attempt $attempt): $body"
              if echo "$body" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == $sha' >/dev/null 2>&1; then
                continue 2
              fi
              sleep 10
            done
            echo "::error::$url never reported version $GITHUB_SHA with status ok"
            exit 1
          done

      - name: Startup logs of the new revisions (migration lines)
        if: always()
        run: |
          for svc in review ideas; do
            echo "::group::$PREFIX-$svc"
            az containerapp logs show -n "$PREFIX-$svc" -g "$RG" --type console --tail 40 --format text || true
            echo "::endgroup::"
          done

      - name: Publish the UI to the storage static website
        run: |
          cat > ui/config.js <<EOF
          // Written by the deploy workflow for commit $GITHUB_SHA.
          window.PK_CONFIG = {
            ideasUrl: "$IDEAS_URL",
            reviewUrl: "$REVIEW_URL",
          };
          EOF
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode key -d '$web' -s ui --overwrite \
            --content-cache-control "no-cache" --output none
          curl -sf "$UI_ORIGIN/config.js" | grep -q "$IDEAS_URL"
          echo "UI live at $UI_ORIGIN"
