name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check services tests

  sast:
    name: sast (bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - run: bandit -r services/ideas/ideas services/review/review

  sca:
    name: sca (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r services/ideas/requirements.txt -r services/review/requirements.txt

  policy:
    name: policy (checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.9
      - name: Bicep, Dockerfiles and workflows against Checkov's policies (accepted exceptions in .checkov.yaml)
        run: checkov -d . --config-file .checkov.yaml

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every commit for credentials
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  validate:
    name: validate system.yaml and OpenAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - run: check-jsonschema --schemafile system.schema.json system.yaml
      - run: openapi-spec-validator services/ideas/openapi.yaml services/review/openapi.yaml
      - name: Build and lint the Bicep (warnings fail)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null && az bicep lint --file infra/main.bicep --diagnostics-format sarif | jq -e '[.runs[].results[]] | length == 0'

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [ideas, review]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: bash .github/scripts/start-sql.sh
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - name: Tests with coverage (fails under 70%)
        working-directory: services/${{ matrix.service }}
        run: python -m pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=70

  integration:
    name: integration (ideas calls review over HTTP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      - run: bash .github/scripts/start-sql.sh
      - run: pip install -r services/ideas/requirements-dev.txt -r services/review/requirements-dev.txt
      - run: python -m pytest

  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [ideas, review]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=${{ github.sha }} -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Scan the image (fails on any fixable HIGH or CRITICAL vulnerability)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress ${{ matrix.service }}:${{ github.sha }}
