<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="htmx-config" content='{"scrollIntoViewOnBoost": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "...", "swap": true}]}' />
    <title>{% block title %}Pitch Kitchen{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
  </head>
  <body hx-boost="true">
    <header class="topbar">
      <a class="wordmark" href="{{ url_for('home') }}">Pitch Kitchen</a>
    </header>
    <main class="{% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
